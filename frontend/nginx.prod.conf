#
# ЭТО КОНФИГ ДЛЯ PRODUCTION (nginx.prod.conf)
#
server {
    # Nginx будет слушать на порту 80 внутри контейнера
    listen 80;
    # --- ИЗМЕНЕНИЕ: Указываем домен ---
    server_name _;  # <--- Catch-all (отвечать на всё)

    # Корень, где лежат собранные файлы
root /usr/share/nginx/html;
    index index.html index.htm;

    # --- ЧАСТЬ 1 ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- ЧАСТЬ 2: ПРОКСИ ДЛЯ API ---
    # location /api {  <-- УБЕРИТЕ КОНЕЧНЫЙ СЛЭШ ИЛИ ИСПОЛЬЗУЙТЕ СЛЭШ В КОНЦЕ PROXY_PASS
    location /api/ {
        # Имя сервиса из docker-compose.prod.yml
        # СЛЭШ В КОНЦЕ УБИРАЕТ /api/ ИЗ ПУТИ
        proxy_pass http://schedule-api-prod:3000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Обработка ошибок
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}