version: '3.8'

services:
  # 1. ФРОНТЕНД (Vite Dev Server)
  schedule-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - schedule-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - schedule-net

  # 2. БЭКЕНД (NestJS Dev)
  schedule-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: 
      # --- ИСПРАВЛЕНИЕ 1: Указываем имя контейнера БД вместо переменной ---
      - DB_HOST=schedule-db
      # --------------------------------------------------------------------
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - API_PORT=${API_PORT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    command: pnpm run start:dev
    ports:
      - "3000:3000"
    depends_on:
      schedule-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - schedule-net

  # 3. БАЗА ДАННЫХ (PostgreSQL)
  schedule-db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # --- ИСПРАВЛЕНИЕ 2: Используем $$ для обращения к переменным ВНУТРИ контейнера ---
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      # -------------------------------------------------------------------------------
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - schedule-net

volumes:
  postgres_data:

networks:
  schedule-net:
    driver: bridge